# SonarQube Configuration for inv-vmware-opa
sonar.projectKey=inv-vmware-opa
sonar.projectName=VMware Inventory OPA
sonar.projectVersion=0.9.0

# Source code paths
sonar.sources=src
sonar.tests=tests

# Python specific settings
sonar.language=py
sonar.python.version=3.10,3.11,3.12

# Coverage report paths (if available)
# Note: Coverage reports are not currently generated due to SQLAlchemy
# table redefinition issues in test suite. See docs/test-coverage-status.md
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Test coverage notes
# Current status: 0% (tests exist but coverage reports not generated)
# Tests available: 25 passing tests in test_column_mapper.py
# Action required: Fix SQLAlchemy model definitions for test compatibility

# Exclusions
sonar.exclusions=**/migrations/**,**/__pycache__/**,**/.venv/**,**/build/**,**/dist/**,**/.git/**,**/site/**
sonar.test.exclusions=tests/**

# Encoding
sonar.sourceEncoding=UTF-8
